<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jaji's Admin</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--ink2:#444;--mute:#888;--line:#e7e7e7;--bg:#f6f6f4;--card:#fff;--gold:#b08d57;--green:#16803c;--red:#c62828;--amber:#b26a00;--blue:#1d4ed8;--r:10px}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.hide{display:none!important}
/* layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav{background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
nav .logo{display:block;margin:0 auto 6px;width:110px}
nav .tag{text-align:center;color:var(--mute);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:22px}
nav .grp{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;margin:18px 10px 6px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink2);cursor:pointer}
nav a:hover{background:#f2f2f0}
nav a.on{background:var(--ink);color:#fff}
nav a .n{margin-left:auto;font-size:11px;background:var(--gold);color:#fff;border-radius:10px;padding:0 7px}
nav .me{margin-top:26px;padding:10px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
main{padding:26px 32px;max-width:1280px;width:100%}
h1{font-size:22px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 20px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1}
/* controls */
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{opacity:.88}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.red{background:#fff;color:var(--red);border-color:#f0caca}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:wait}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #0001;border-color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.search{max-width:320px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* cards + tables */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi .l{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px}
.kpi .h{font-size:12px;color:var(--mute)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.card h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafaf8;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid #f0f0ee;vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#fafaf8}
.tbl{overflow:auto;max-height:calc(100vh - 210px)}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#eee;border:1px solid var(--line);display:block}
.mute{color:var(--mute)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.right{text-align:right}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:500;background:#eee;color:#333;white-space:nowrap}
.b-green{background:#e6f4ea;color:var(--green)}.b-red{background:#fdecea;color:var(--red)}.b-amber{background:#fff4e0;color:var(--amber)}
.b-blue{background:#e8efff;color:var(--blue)}.b-gray{background:#f0f0ee;color:#555}.b-gold{background:#f6efe3;color:#7a5c2e}
.empty{padding:40px;text-align:center;color:var(--mute)}
/* drawer */
.shade{position:fixed;inset:0;background:#0006;z-index:20;display:flex;justify-content:flex-end}
.drawer{background:#fff;width:min(720px,100%);height:100%;overflow:auto;padding:24px 28px;box-shadow:-10px 0 30px #0002}
.drawer h2{margin:0 0 4px;font-size:19px}
.drawer .x{float:right;border:0;background:none;font-size:24px;cursor:pointer;color:var(--mute);line-height:1}
.sec{margin:20px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px;font-weight:500}
.f .req{color:var(--red)}
.f .err{color:var(--red);font-size:12px;margin-top:3px}
.f.full{grid-column:1/-1}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px}
.kv div:nth-child(odd){color:var(--mute)}
.imgs{display:flex;gap:10px;flex-wrap:wrap}
.slot{width:112px}
.slot .pic{width:112px;height:112px;border:1px dashed #ccc;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:#fafaf8;color:var(--mute);font-size:12px;text-align:center;position:relative}
.slot .pic img{width:100%;height:100%;object-fit:cover}
.slot .pic .spin{position:absolute;inset:0;background:#fffc;display:flex;align-items:center;justify-content:center}
.slot .row{display:flex;justify-content:space-between;font-size:12px;margin-top:4px}
.slot .row a{cursor:pointer;color:var(--red)}
.vt input{padding:6px 8px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;position:sticky;bottom:-24px;background:#fff;padding:14px 0}
/* toast + login */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;z-index:50;box-shadow:0 6px 20px #0003;max-width:90vw}
#toast.bad{background:var(--red)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login .card{width:360px;padding:32px}
.login img{display:block;margin:0 auto 6px;width:130px}
.login p{text-align:center;color:var(--mute);margin:0 0 22px}
.login .f{margin-bottom:12px}
@media (max-width:900px){.app{grid-template-columns:1fr}nav{position:static;height:auto}.kpis,.two,.grid2{grid-template-columns:1fr 1fr}main{padding:18px}}
</style>
</head>

<script>

const DEFAULT_API = "https://tbkvtcuqszgmahzswspe.supabase.co/functions/v1/api";

// ===================================================================== helpers
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inr = (v) => v == null || v === "" ? "—" : "₹" + Number(v).toLocaleString("en-IN", { minimumFractionDigits: 0, maximumFractionDigits: 2 });

function toast(msg, bad = false) {
  const t = $("#toast"); t.textContent = msg; t.className = bad ? "bad" : ""; clearTimeout(t._h);
  t._h = setTimeout(() => t.className = "hide", bad ? 6000 : 2800);
}
async function api(path, { method = "GET", body } = {}) {
  const r = await fetch(API + path, {
    method, headers: { "Content-Type": "application/json", ...(TOKEN ? { Authorization: "Token " + TOKEN } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) { logout(); throw new Error("Please log in again."); }
  const data = r.status === 204 ? null : await r.json().catch(() => null);
  if (!r.ok) {
    const e = new Error(data?.detail || data?.message || data?.error || (data?.errors ? "Please fix the highlighted fields" : "Request failed (" + r.status + ")"));
    e.fields = data?.errors; throw e;
  }
  return data;
}
function imgUrl(name, w) {
  if (!name) return "";
  if (/^https?:/.test(name)) return name;
  const id = name.startsWith("media/") ? name : "media/" + name;
  const t = w ? `c_fill,w_${w},h_${w},q_auto,f_auto/` : "";
  return `https://res.cloudinary.com/${ME?.cloud_name}/image/upload/${t}v1/${id}`;
}
const STATUS_BADGE = { pending: "b-amber", confirmed: "b-blue", processing: "b-gold", shipped: "b-blue", delivered: "b-green", cancelled: "b-gray", refunded: "b-gray", failed: "b-red" };
const badge = (s, cls) => `<span class="badge ${cls || STATUS_BADGE[s] || "b-gray"}">${esc(s)}</span>`;
// Express-checkout customers have no account; show them as "Guest".

// ===================================================================== image upload (Cloudinary, signed by our API)
async function compress(file, maxW = 1200, q = 0.7) {
  if (!file.type.startsWith("image/") || file.type === "image/gif") return file;
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, maxW / bmp.width);
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", q));
  return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
}
async function uploadImage(file, folder) {
  const small = await compress(file);
  if (small.size > 1024 * 1024) throw new Error("Image is still over 1 MB after compression — please use a smaller image.");
  const s = await api("/admin/upload-signature", { method: "POST", body: { folder } });
  const fd = new FormData();
  fd.append("file", small, small.name.replace(/[^\w.-]+/g, "_"));
  for (const k of ["api_key", "timestamp", "signature", "folder", "use_filename", "unique_filename"]) fd.append(k, s[k]);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${s.cloud_name}/image/upload`, { method: "POST", body: fd });
  const j = await r.json();
  if (!r.ok) throw new Error("Upload failed: " + (j.error?.message || r.status));
  return j.public_id;
}

// ===================================================================== drawer + generic form
function drawer(html) {
  closeDrawer();
  const s = document.createElement("div"); s.className = "shade"; s.id = "shade";
  s.innerHTML = `<div class="drawer">${html}</div>`;
  s.addEventListener("mousedown", (e) => { if (e.target === s) closeDrawer(); });
  document.body.appendChild(s);
  return s.firstElementChild;
}
function closeDrawer() { $("#shade")?.remove(); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

function fieldHtml(f, v) {
  const id = "f_" + f.k, req = f.req ? ' <span class="req">*</span>' : "";
  let input;
  if (f.type === "textarea") input = `<textarea id="${id}">${esc(v)}</textarea>`;
  else if (f.type === "select") input = `<select id="${id}">${f.req ? "" : '<option value=""></option>'}${f.options.map(([val, lab]) => `<option value="${esc(val)}" ${String(v) === String(val) ? "selected" : ""}>${esc(lab)}</option>`).join("")}</select>`;
  else if (f.type === "image") return imageSlot(f, v);
  else input = `<input id="${id}" type="${f.type || "text"}" value="${esc(v)}" ${f.step ? `step="${f.step}"` : ""} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ""} ${f.list ? `list="${f.list}" autocomplete="off"` : ""}>`;
  return `<div class="f ${f.full || f.type === "textarea" ? "full" : ""}"><label for="${id}">${esc(f.label)}${req}</label>${input}<div class="err" data-err="${f.k}"></div></div>`;
}
function imageSlot(f, v) {
  return `<div class="slot" data-img="${f.k}" data-folder="${f.folder}" data-val="${esc(v || "")}">
    <div class="pic">${v ? `<img src="${imgUrl(v, 240)}">` : "+ Add image"}</div>
    <div class="row"><span>${esc(f.label)}${f.req ? ' <span style="color:var(--red)">*</span>' : ""}</span>${v && !f.req ? "<a data-clear>remove</a>" : ""}</div>
    <input type="file" accept="image/*" class="hide"><div class="err" data-err="${f.k}"></div></div>`;
}
function wireImages(root) {
  root.querySelectorAll(".slot").forEach((slot) => {
    const file = slot.querySelector("input[type=file]"), pic = slot.querySelector(".pic");
    pic.onclick = () => file.click();
    slot.querySelector("[data-clear]")?.addEventListener("click", () => { slot.dataset.val = ""; pic.innerHTML = "+ Add image"; });
    file.onchange = async () => {
      if (!file.files[0]) return;
      pic.insertAdjacentHTML("beforeend", '<div class="spin">Uploading…</div>');
      try {
        const id = await uploadImage(file.files[0], slot.dataset.folder);
        slot.dataset.val = id; pic.innerHTML = `<img src="${imgUrl(id, 240)}">`;
      } catch (e) { toast(e.message, true); pic.querySelector(".spin")?.remove(); }
    };
  });
}
function readForm(root, fields) {
  const out = {};
  for (const f of fields) {
    if (f.type === "image") out[f.k] = root.querySelector(`[data-img="${f.k}"]`).dataset.val || null;
    else out[f.k] = root.querySelector("#f_" + f.k).value;
  }
  return out;
}
function showErrors(root, fields) {
  root.querySelectorAll("[data-err]").forEach((e) => e.textContent = "");
  for (const [k, m] of Object.entries(fields || {})) { const e = root.querySelector(`[data-err="${k}"]`); if (e) e.textContent = m; }
}

async function resourcePage(key) {
  const R = RES[key];
  view(`<h1>${R.title}</h1><p class="sub">${R.sub}</p><div id="top"></div>
    <div class="bar"><input class="search" id="q" placeholder="Search…"><div class="grow"></div><button class="btn" id="add">+ Add</button></div>
    <div class="card tbl" id="list"><div class="empty">Loading…</div></div>`);
  if (R.top) R.top($("#top")).catch((e) => toast(e.message, true));
  let rows = [];
  const draw = () => {
    const term = $("#q").value.toLowerCase();
    const shown = rows.filter((r) => !term || JSON.stringify(r).toLowerCase().includes(term));
    $("#list").innerHTML = shown.length ? `<table><tr>${R.cols.map((c) => `<th>${c[0]}</th>`).join("")}</tr>
      ${shown.map((r, i) => `<tr class="click" data-id="${r.id}">${R.cols.map((c) => `<td>${c[1](r, i)}</td>`).join("")}</tr>`).join("")}</table>`
      : `<div class="empty">Nothing here yet.</div>`;
    $("#list").querySelectorAll("tr[data-id]").forEach((tr) => tr.onclick = () => edit(rows.find((r) => r.id == tr.dataset.id)));
  };
  const load = async () => { rows = await api(`/admin/r/${key}`); draw(); };
  const edit = (row) => {
    const imgs = R.fields.filter((f) => f.type === "image"), rest = R.fields.filter((f) => f.type !== "image");
    const dr = drawer(`<button class="x">×</button><h2>${row ? "Edit" : "Add"} — ${R.title}</h2>
      <div class="grid2" style="margin-top:16px">${rest.map((f) => fieldHtml(f, row?.[f.k])).join("")}</div>
      ${imgs.length ? `<div class="sec">Images</div><div class="imgs">${imgs.map((f) => fieldHtml(f, row?.[f.k])).join("")}</div>` : ""}
      <div class="actions">${row ? '<button class="btn red" id="del">Delete</button><div style="flex:1"></div>' : ""}<button class="btn ghost" id="cancel">Cancel</button><button class="btn" id="save">Save</button></div>`);
    wireImages(dr);
    dr.querySelector(".x").onclick = dr.querySelector("#cancel").onclick = closeDrawer;
    dr.querySelector("#save").onclick = async (e) => {
      e.target.disabled = true;
      try {
        await api(`/admin/r/${key}${row ? "/" + row.id : ""}`, { method: row ? "PATCH" : "POST", body: readForm(dr, R.fields) });
        closeDrawer(); toast("Saved"); load();
      } catch (err) { showErrors(dr, err.fields); toast(err.message, true); e.target.disabled = false; }
    };

async function productDrawer(id, onChange) {

  const p = id ? await api("/admin/r/products/" + id) : { brand: "jajis" };
  let variants = id ? await api("/admin/r/variants?product_id=" + id) : [];
  const F = [
    { k: "title", label: "Product name", req: 1, full: 1 },
    { k: "category_id", label: "Category", req: 1, type: "select", options: CATS.map((c) => [c.id, c.name]) },
    { k: "brand", label: "Brand" },
    { k: "description", label: "Description", type: "textarea", req: 1 },
    IMG("image1", "Main image", "product_images", 1), IMG("image2", "Image 2", "product_images"), IMG("image3", "Image 3", "product_images"), IMG("image4", "Image 4", "product_images"),
  ];
  const vrow = (v, i) => `<tr data-i="${i}"><td><input data-k="quantity_label" value="${esc(v.quantity_label)}" placeholder="e.g. 250ml"></td>
    <td><input data-k="mrp" type="number" step="0.01" value="${esc(v.mrp)}"></td><td><input data-k="price" type="number" step="0.01" value="${esc(v.price)}"></td>

    <td><button class="btn red sm" data-rm="${i}">✕</button></td></tr>`;
  dr.innerHTML = `<button class="x">×</button><h2>${id ? esc(p.title) : "New product"}</h2>${id ? `<div class="mute">Product #${p.id} · created ${dt(p.created_at)}</div>` : ""}
    <div class="grid2" style="margin-top:16px">${F.filter((f) => f.type !== "image").map((f) => fieldHtml(f, p[f.k])).join("")}</div>
    <div class="sec">Images <span style="text-transform:none;letter-spacing:0">(compressed automatically, like before)</span></div>
    <div class="imgs">${F.filter((f) => f.type === "image").map((f) => fieldHtml(f, p[f.k])).join("")}</div>
    <div class="sec">Sizes, prices & stock</div>
    <div class="card vt"><table><tr><th>Size / quantity</th><th>MRP ₹</th><th>Selling price ₹</th><th>Stock</th><th>SKU</th><th></th></tr><tbody id="vbody">${variants.map(vrow).join("")}</tbody></table>
    <div style="padding:10px"><button class="btn ghost sm" id="addv">+ Add size</button></div></div>
    <div class="actions">${id ? '<button class="btn red" id="del">Delete product</button><div style="flex:1"></div>' : ""}<button class="btn ghost" id="cancel">Cancel</button><button class="btn" id="save">Save product</button></div>`;
  wireImages(dr);
  const collect = () => [...dr.querySelectorAll("#vbody tr")].map((tr) => {
    const v = { ...variants[tr.dataset.i] }; tr.querySelectorAll("input").forEach((i) => v[i.dataset.k] = i.value); return v;
  });
  const redraw = () => { dr.querySelector("#vbody").innerHTML = variants.map(vrow).join(""); };
  dr.querySelector("#addv").onclick = () => { variants = collect(); variants.push({ stock: 0 }); redraw(); };
  dr.querySelector("#vbody").onclick = (e) => {
    if (!e.target.dataset.rm) return;
    variants = collect(); const v = variants[e.target.dataset.rm];
    if (v.id) v._delete = true, e.target.closest("tr").style.display = "none"; else { variants.splice(e.target.dataset.rm, 1); redraw(); }
  };
  dr.querySelector(".x").onclick = dr.querySelector("#cancel").onclick = closeDrawer;
  dr.querySelector("#save").onclick = async (e) => {
    e.target.disabled = true;
    try {
      const vs = collect().map((v, i) => ({ ...v, _delete: variants[i]?._delete }));
      for (const v of vs) if (!v._delete && (!v.quantity_label || v.mrp === "" || v.price === "")) throw new Error("Each size needs a name, MRP and price.");
      const saved = await api(`/admin/r/products${id ? "/" + id : ""}`, { method: id ? "PATCH" : "POST", body: readForm(dr, F) });
      for (const v of vs) {
        const body = { product_id: saved.id, quantity_label: v.quantity_label, mrp: v.mrp, price: v.price, stock: v.stock || 0, sku: v.sku || null };
        if (v._delete && v.id) await api("/admin/r/variants/" + v.id, { method: "DELETE" });
        else if (v.id) await api("/admin/r/variants/" + v.id, { method: "PATCH", body });
        else if (!v._delete) await api("/admin/r/variants", { method: "POST", body });
      }
      closeDrawer(); toast("Product saved"); onChange?.();
    } catch (err) { showErrors(dr, err.fields); toast(err.message, true); e.target.disabled = false; }
  };
  dr.querySelector("#del")?.addEventListener("click", async () => {
    if (!confirmDelete()) return;
    try { await api("/admin/r/products/" + id, { method: "DELETE" }); closeDrawer(); toast("Product deleted"); onChange?.(); } catch (err) { toast(err.message, true); }
  });
}

      ${rows.map((t) => `<tr><td class="mute">${dt(t.created_at)}</td><td>${esc(t.username)}</td><td class="right">${inr(t.amount)}</td><td>${sb(t.status)}</td>
        <td class="mono">${esc(t.razorpay_order_id)}</td><td class="mono">${esc(t.razorpay_payment_id || "—")}</td>
        <td>${t.order_id ? `<a href="#" data-o="${t.order_id}">#${t.order_id}</a>` : badge("no order", "b-red")}</td>
        <td>${!t.order_id && ["success", "created"].includes(t.status) ? `<button class="btn sm" data-r="${t.id}">Recover order</button>` : ""}</td></tr>`).join("")}</table>` : '<div class="empty">Nothing to show — all payments are linked to orders.</div>';
    $("#list").querySelectorAll("[data-o]").forEach((a) => a.onclick = (e) => { e.preventDefault(); orderDrawer(a.dataset.o); });
    $("#list").querySelectorAll("[data-r]").forEach((b) => b.onclick = async () => {
      b.disabled = true; try { toast((await api(`/admin/transactions/${b.dataset.r}/recreate`, { method: "POST" })).message); load(); } catch (e) { toast(e.message, true); b.disabled = false; }
    });
  };
  $("#tabs").onclick = (e) => { if (e.target.dataset.o === undefined) return; orphaned = e.target.dataset.o; $("#tabs").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === e.target)); load(); };
  await load();
}

// ===================================================================== customers
async function customersPage() {
  view(`<h1>Customers</h1><p class="sub">Accounts registered on the website.</p>
    <div class="bar"><input class="search" id="q" placeholder="Search username or email…"></div><div class="card tbl" id="list"><div class="empty">Loading…</div></div>`);
  const load = async () => {
    const rows = await api("/admin/users" + ($("#q").value ? "?q=" + encodeURIComponent($("#q").value) : ""));
    $("#list").innerHTML = `<table><tr><th>Username</th><th>Email</th><th>Paid orders</th><th>Joined</th><th>Last login</th><th></th></tr>
      ${rows.map((u) => `<tr><td><b>${who(u.username)}</b>${u.first_name ? `<div class="mute">${esc((u.first_name + " " + (u.last_name || "")).trim())}</div>` : ""}</td><td>${esc(u.email)}</td><td>${u.paid_orders}</td><td class="mute">${dt(u.date_joined)}</td>
        <td class="mute">${dt(u.last_login)}</td><td>${u.is_staff ? badge("staff", "b-gold") : ""}${u.is_active ? "" : badge("disabled", "b-red")}</td></tr>`).join("")}</table>`;
  };
  let t; $("#q").oninput = () => { clearTimeout(t); t = setTimeout(load, 300); };
  await load();
}

// ===================================================================== shell + routing
// ===================================================================== order-desk staff logins
async function staffLoginsPage() {
  const desk = location.origin + "/staff.html";
  view(`<h1>Staff logins</h1><p class="sub">Order-desk accounts can only see paid orders and update their status — no products, customers, payments or settings.<br>
    Staff link: <a href="${esc(desk)}" target="_blank" rel="noopener"><b>${esc(desk)}</b></a></p>
    <div class="two"><div class="card" style="padding:20px"><h3>Add a staff login</h3>
      <form id="sf">
        <div class="f"><label for="sn">Name</label><input id="sn" placeholder="e.g. Anu (packing)" style="width:100%"></div>
        <div class="f" style="margin-top:8px"><label for="su">Username</label><input id="su" required autocapitalize="off" style="width:100%"></div>
        <div class="f" style="margin-top:8px"><label for="sp">Password (8+ characters)</label><input id="sp" required minlength="8" style="width:100%"></div>
        <button class="btn" style="margin-top:12px">Create login</button>
      </form></div>
    <div class="card"><h3 style="padding:16px 16px 0">Current logins</h3><div id="sl"><div class="empty">Loading…</div></div></div></div>`);
  const load = async () => {
    const rows = await api("/admin/order-staff");
    $("#sl").innerHTML = rows.length ? `<table>${rows.map((r) => `<tr><td><b>${esc(r.username)}</b><div class="mute">${esc(r.first_name || "")}</div></td>
      <td>${r.is_active ? badge("active", "b-green") : badge("disabled", "b-gray")}<div class="mute">${r.updates} updates · last in ${dt(r.last_login)}</div></td>
      <td class="right"><button class="btn ghost sm" data-pw="${r.id}">New password</button>
      <button class="btn ${r.is_active ? "red" : "ghost"} sm" data-act="${r.id}" data-on="${r.is_active ? 0 : 1}">${r.is_active ? "Disable" : "Enable"}</button></td></tr>`).join("")}</table>`
      : '<div class="empty">No staff logins yet.</div>';
    $("#sl").querySelectorAll("[data-pw]").forEach((b) => b.onclick = async () => {
      const pw = prompt("New password (8+ characters):"); if (!pw) return;
      try { toast((await api("/admin/order-staff/" + b.dataset.pw, { method: "PATCH", body: { password: pw } })).message); } catch (e) { toast(e.message, true); }
    });
    $("#sl").querySelectorAll("[data-act]").forEach((b) => b.onclick = async () => {
      try { await api("/admin/order-staff/" + b.dataset.act, { method: "PATCH", body: { is_active: b.dataset.on === "1" } }); load(); } catch (e) { toast(e.message, true); }
    });
  };
  $("#sf").onsubmit = async (e) => {
    e.preventDefault(); const b = e.target.querySelector("button"); b.disabled = true;
    try {
      toast((await api("/admin/order-staff", { method: "POST", body: { name: $("#sn").value, username: $("#su").value, password: $("#sp").value } })).message);
      e.target.reset(); load();
    } catch (err) { toast(err.message, true); }
    b.disabled = false;
  };
  load();
}

const PAGES = [
  ["Overview", [["dashboard", "Dashboard", dashboard], ["notifications", "Email & WhatsApp", notificationsPage], ["staff", "Staff logins", staffLoginsPage]]],
  ["Shop", [["orders", "Orders", ordersPage], ["products", "Products", productsPage], ["categories", "Categories", () => resourcePage("categories")],
    ["payments", "Payments", paymentsPage], ["shipping", "Shipping charges", () => resourcePage("shipping")], ["customers", "Customers", customersPage]]],
  ["Leads", [["eventhall", "Event hall bookings", () => resourcePage("eventhall")], ["franchise", "Franchise enquiries", franchisePage]]],
  ["Website", [["banners", "Home banner", () => resourcePage("banners")], ["salons", "Salons", () => resourcePage("salons")],
    ["courses", "Academy courses", () => resourcePage("courses")], ["food", "Food court menu", () => resourcePage("food")], ["cosmetics", "Cosmetics", () => resourcePage("cosmetics")]]],
];
function view(html) { $("#page").innerHTML = html; }
function shell() {
  $("#root").innerHTML = `<div class="app"><nav><img class="logo" src="logo.png" alt="Jaji's"><div class="tag">Admin</div>
    ${PAGES.map(([g, items]) => `<div class="grp">${g}</div>${items.map(([k, l]) => `<a data-k="${k}" href="#${k}">${l}</a>`).join("")}`).join("")}
    <div class="me">Signed in as <b>${esc(ME.username)}</b><br><a href="#" id="out" style="padding:0;display:inline;color:var(--red)">Sign out</a></div></nav>
    <main id="page"></main></div>`;
  $("#out").onclick = (e) => { e.preventDefault(); logout(); };
  route();
}
async function route() {
  closeDrawer();
  const key = location.hash.slice(1) || "dashboard";
  const page = PAGES.flatMap((g) => g[1]).find((p) => p[0] === key) || PAGES[0][1][0];
  document.querySelectorAll("nav a[data-k]").forEach((a) => a.classList.toggle("on", a.dataset.k === page[0]));
  try { await page[2](); } catch (e) { view(`<div class="empty">Couldn't load this page: ${esc(e.message)}</div>`); }
}
window.addEventListener("hashchange", () => ME && route());

function logout() { TOKEN = null; ME = null; localStorage.removeItem("jaji_admin_token"); loginScreen(); }
function loginScreen() {
  $("#root").innerHTML = `<div class="login"><form class="card" id="lf"><img src="logo.png" alt="Jaji's"><p>Admin panel</p>
    <div class="f"><label>Username</label><input id="u" autocomplete="username" required></div>
    <div class="f"><label>Password</label><input id="p" type="password" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%;margin-top:6px">Sign in</button>
    <p style="margin:14px 0 0;font-size:12px">Use the same staff account you used for the old Django admin.</p></form></div>`;
  $("#lf").onsubmit = async (e) => {
    e.preventDefault(); const b = e.target.querySelector("button"); b.disabled = true;
    try {
      const r = await api("/admin/login", { method: "POST", body: { username: $("#u").value, password: $("#p").value } });
      TOKEN = r.token; localStorage.setItem("jaji_admin_token", TOKEN); await boot();
    } catch (err) { toast(err.message, true); b.disabled = false; }
  };
}
async function boot() {
  if (!TOKEN) return loginScreen();
  try { ME = await api("/admin/me"); $("#toast").className = "hide"; shell(); } catch { loginScreen(); }
}
boot();
</script>
